<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PB Viewport Diag 3</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PB Diag">
<link rel="manifest" href="diag.webmanifest">
<link rel="apple-touch-icon" href="app_icon.png">
<style id="base">
  html, body { margin:0; padding:0; background:#FF0033; }
  * { box-sizing:border-box; }
  #root { width:100%; }
  /* DRAWABILITY PROBE: 100vh tall (the full screen per CSS). If the yellow bar at
     its bottom is visible on device, the region below the layout viewport can be
     painted by page content. If it is not, that region is unreachable. */
  #probe100vh { position:fixed; top:0; left:0; right:0; height:100vh; z-index:0;
                background:linear-gradient(to bottom, transparent 0, transparent calc(100% - 74px), #00E5FF calc(100% - 74px)); }
  #probe100vh span { position:absolute; left:0; right:0; bottom:0; height:74px;
                     display:flex; align-items:center; justify-content:center; text-align:center;
                     background:#FFE000; color:#000; font:700 15px/1.15 -apple-system,system-ui;
                     border-top:3px solid #000; padding:4px 8px; }
  #panel { position:fixed; top:0; left:0; right:0; z-index:2;
           background:rgba(255,255,255,0.97); border:3px solid #FF00FF; border-top:none;
           font:11px/1.3 ui-monospace,Menlo,monospace; color:#000;
           padding:calc(env(safe-area-inset-top,0px) + 6px) 8px 8px; }
  h1 { font:700 13px/1.2 -apple-system,system-ui; margin:0 0 4px; }
  table { border-collapse:collapse; width:100%; font:10px/1.25 ui-monospace,Menlo,monospace; }
  th,td { border:1px solid #bbb; padding:2px 3px; text-align:right; }
  th:first-child, td:first-child { text-align:left; }
  th { background:#eee; }
  .hit { background:#c8f7c5; font-weight:700; }
  #probeEnv { position:absolute; visibility:hidden;
              padding: env(safe-area-inset-top,0px) env(safe-area-inset-right,0px)
                       env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px); }
  #note { margin-top:5px; font:10px/1.3 -apple-system,system-ui; color:#333; }
</style>
</head>
<body>
<div id="probeEnv"></div>
<div id="root">
  <div id="probe100vh"><span id="probeLabel">▼ YELLOW BAR — if you can see this whole bar, page content CAN paint the bottom strip</span></div>
  <div id="panel">
    <h1>Diag 3 — which recipe changes the viewport?</h1>
    <div id="status">running configurations…</div>
    <div id="tbl"></div>
    <div id="note"></div>
  </div>
</div>
<script>
var BUILD='diag-3';
var COVER='width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no';
var NOCOVER='width=device-width,initial-scale=1,user-scalable=no';
var vpMeta=document.querySelector('meta[name=viewport]');
var cfgStyle=document.createElement('style'); document.head.appendChild(cfgStyle);
var fixedProbe=document.createElement('div');
fixedProbe.style.cssText='position:fixed;inset:0;visibility:hidden;pointer-events:none';
document.body.appendChild(fixedProbe);

var CONFIGS=[
  ['A height:100%  +cover',            'html,body{height:100%}',                    COVER],
  ['B min-h:100vh  +cover  (picker)',  'html,body{min-height:100vh}#root{min-height:100vh}', COVER],
  ['C fill-avail   +cover',            'html,body{height:-webkit-fill-available}',   COVER],
  ['D height:100%  NO cover',          'html,body{height:100%}',                    NOCOVER],
  ['E min-h:100vh  NO cover',          'html,body{min-height:100vh}#root{min-height:100vh}', NOCOVER]
];
var results=[];
function unit(u){
  var d=document.createElement('div');
  d.style.cssText='position:absolute;visibility:hidden;width:1px;height:'+u;
  document.body.appendChild(d); var h=d.getBoundingClientRect().height; d.remove();
  return Math.round(h);
}
function snap(name){
  var cs=getComputedStyle(document.getElementById('probeEnv'));
  var r=fixedProbe.getBoundingClientRect();
  var de=document.documentElement;
  return { name:name,
    inner:window.innerHeight, client:de.clientHeight,
    fixH:Math.round(r.height), fixBot:Math.round(r.bottom),
    envT:Math.round(parseFloat(cs.paddingTop)), envB:Math.round(parseFloat(cs.paddingBottom)),
    vh:unit('100vh'), dvh:unit('100dvh'),
    scroll:Math.max(de.scrollHeight,document.body.scrollHeight)>de.clientHeight?'yes':'no' };
}
function run(i){
  if(i>=CONFIGS.length){ finish(); return; }
  var c=CONFIGS[i];
  cfgStyle.textContent=c[1];
  vpMeta.setAttribute('content',c[2]);
  document.getElementById('status').textContent='measuring '+c[0]+' …';
  setTimeout(function(){ results.push(snap(c[0])); run(i+1); }, 900);
}
function finish(){
  // End on the picker recipe with cover, and reveal the drawability probe.
  cfgStyle.textContent='html,body{min-height:100vh}#root{min-height:100vh}';
  vpMeta.setAttribute('content',COVER);
  setTimeout(function(){
    var screenH=screen.height, base=results[0]?results[0].client:0;
    var h='<table><tr><th>config</th><th>inner</th><th>client</th><th>fixed h</th>'+
          '<th>fix bot</th><th>envT</th><th>envB</th><th>100vh</th><th>scroll</th></tr>';
    results.forEach(function(r){
      var full=(r.client===screenH);
      h+='<tr'+(full?' class="hit"':'')+'><td>'+r.name+'</td><td>'+r.inner+'</td><td>'+r.client+
         '</td><td>'+r.fixH+'</td><td>'+r.fixBot+'</td><td>'+r.envT+'</td><td>'+r.envB+
         '</td><td>'+r.vh+'</td><td>'+r.scroll+'</td></tr>';
    });
    h+='</table>';
    document.getElementById('tbl').innerHTML=h;
    document.getElementById('status').innerHTML='build '+BUILD+' &middot; standalone '+
      navigator.standalone+' &middot; screen '+screen.width+'x'+screen.height+
      ' &middot; short by '+(screen.height-base)+'px in config A';
    document.getElementById('note').innerHTML=
      'GREEN row = that recipe gives the FULL screen height ('+screenH+'). '+
      'Now showing the 100vh drawability probe: the CYAN band and YELLOW bar below are '+
      'drawn by page content inside a 100vh-tall fixed box. Screenshot the whole screen.';
  }, 900);
}
setTimeout(function(){ run(0); }, 300);
</script>
</body>
</html>
