<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Photobox</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Photobox">
  <meta name="theme-color" content="#0E9E8E">
  <link rel="apple-touch-icon" href="app_icon.png">
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin:0; padding:0; background:#000; }
  </style>
</head>
<body>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }
    // TEMPORARY (bottom-gap investigation): land on the viewport diagnostic so it
    // measures inside the standalone PWA. "continue to prototype" sets the flag.
    // Revert this to the plain splash redirect once the gap is understood.
    if (sessionStorage.getItem('pb_skip_diag')) {
      window.location.replace('screens/splash.html');
    } else {
      window.location.replace('diag.html');
    }
  </script>
</body>
</html>
