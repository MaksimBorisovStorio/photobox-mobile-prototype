<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Photobox — Home</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Photobox">
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../shared/styles.css">
  <style>
    /* iOS 26 Safari tints and blurs the strip behind the status bar with the
       background of the page or of a fixed element at the top. Over the dark hero a
       white page gave a white blur across the photo, so the colour follows the
       header: hero teal while the hero is up, white once the bar turns solid
       (HomeNewScreen sets --hn-top). */
    html, body { margin:0; padding:0; background: var(--hn-top, #0b2b2d); }
    ::-webkit-scrollbar { display: none; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script src="../shared/navigation.js"></script>
  <script type="text/babel" src="../shared/ios-frame.jsx"></script>
  <script type="text/babel" src="../shared/brand.jsx"></script>
  <script type="text/babel" src="../shared/tab-bar.jsx"></script>
  <script type="text/babel" src="home-new.jsx"></script>
  <script type="text/babel">
    function useIsMobile() {
      const [m, setM] = React.useState(() => window.matchMedia('(max-width:519px)').matches);
      React.useEffect(() => {
        const mql = window.matchMedia('(max-width:519px)');
        const cb = e => setM(e.matches);
        mql.addEventListener('change', cb);
        return () => mql.removeEventListener('change', cb);
      }, []);
      return m;
    }
    function App() {
      const mobile = useIsMobile();
      if (mobile) return (
        <div style={{position:'fixed', inset:0, background:'var(--hn-top, #0b2b2d)', overflow:'hidden'}}>
          <HomeNewScreen />
        </div>
      );
      return (
        <div style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh',background:'#1C1C1E'}}>
          <IOSDevice width={402} height={874}>
            <HomeNewScreen />
          </IOSDevice>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
