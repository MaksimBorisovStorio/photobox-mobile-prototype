<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Image Picker</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-title" content="Picker" />
  <link rel="manifest" href="manifest.webmanifest?v=2" />
  <link rel="icon" type="image/png" href="app_icon.png?v=2" />
  <link rel="shortcut icon" type="image/png" href="app_icon.png?v=2" />
  <link rel="apple-touch-icon" sizes="180x180" href="app_icon.png?v=2" />
  <link rel="apple-touch-icon" sizes="167x167" href="app_icon.png?v=2" />
  <link rel="apple-touch-icon" sizes="152x152" href="app_icon.png?v=2" />
  <link rel="apple-touch-icon" href="app_icon.png?v=2" />
  <style>
    /* Mirrors whatoshop's approach exactly: simple natural flow, no height/overflow
       constraints on html/body. With viewport-fit=cover, position:fixed; inset:0
       and position:fixed; bottom:0 already reach the physical screen edges. */
    html, body {
      margin: 0; padding: 0;
      background: #000;
      color: #fff;
      font-family: -apple-system, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
      min-height: 100vh;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }
    #root { width: 100%; min-height: 100vh; }

    /* Desktop preview: iOS device frame on subtle backdrop */
    @media (min-width: 520px) {
      body { background: #0E0E10; }
      body::before {
        content: '';
        position: fixed; inset: -10%;
        background:
          radial-gradient(60% 50% at 30% 20%, rgba(80,90,120,0.18), transparent 60%),
          radial-gradient(70% 60% at 80% 80%, rgba(60,70,90,0.18), transparent 60%);
        pointer-events: none; z-index: 0;
      }
      #root {
        position: relative; z-index: 1;
        display: flex; align-items: center; justify-content: center;
      }
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script src="photos.js?v=16"></script>
  <script type="text/babel" src="ios-frame.jsx?v=16"></script>
  <script type="text/babel" src="image-picker.jsx?v=16"></script>

  <script type="text/babel">
    function useIsMobile() {
      const get = () => typeof window !== 'undefined' && window.matchMedia('(max-width: 519px)').matches;
      const [m, setM] = React.useState(get);
      React.useEffect(() => {
        const mql = window.matchMedia('(max-width: 519px)');
        const cb = (e) => setM(e.matches);
        mql.addEventListener ? mql.addEventListener('change', cb) : mql.addListener(cb);
        return () => mql.removeEventListener ? mql.removeEventListener('change', cb) : mql.removeListener(cb);
      }, []);
      return m;
    }

    function App() {
      const isMobile = useIsMobile();

      if (isMobile) {
        // Same trick whatoshop uses: position:fixed; inset:0 with viewport-fit=cover
        // already reaches all four physical screen edges in iOS Safari and PWA.
        return (
          <div style={{
            position: 'fixed',
            inset: 0,
            background: '#000',
            overflow: 'hidden',
          }}>
            <ImagePickerScreen />
          </div>
        );
      }

      // Desktop preview: keep the iOS device frame
      return (
        <div style={{ position: 'relative', width: '100%', height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <IOSDevice width={402} height={874} dark={true}>
            <div style={{ width: '100%', height: '100%', position: 'relative' }}>
              <ImagePickerScreen />
            </div>
          </IOSDevice>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
